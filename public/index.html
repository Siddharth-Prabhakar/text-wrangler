<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatter Pro - Neo Brutal Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', monospace;
            background: linear-gradient(45deg, #FF0080, #00FF80);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #0080FF;
            border: 4px solid #000;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 8px 8px 0px #000;
            transform: rotate(-1deg);
        }

        .header h1 {
            color: #FFF;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 4px 4px 0px #000;
            transform: rotate(1deg);
        }

        .help-panel {
            background: #FFFF00;
            border: 4px solid #000;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 8px 8px 0px #000;
            transform: rotate(0.5deg);
        }

        .help-panel h3 {
            color: #000;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .help-panel p {
            color: #000;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .main-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-section, .output-section {
            background: #FFF;
            border: 4px solid #000;
            padding: 20px;
            box-shadow: 8px 8px 0px #000;
        }

        .input-section {
            transform: rotate(-0.5deg);
        }

        .output-section {
            transform: rotate(0.5deg);
        }

        .section-title {
            background: #FF0080;
            color: #FFF;
            padding: 10px;
            margin: -20px -20px 15px -20px;
            border-bottom: 4px solid #000;
            font-weight: 700;
            text-shadow: 2px 2px 0px #000;
        }

        textarea {
            width: 100%;
            height: 300px;
            border: 3px solid #000;
            padding: 15px;
            font-family: 'Space Grotesk', monospace;
            font-size: 14px;
            resize: vertical;
            background: #F0F0F0;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px #00FF80;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        button {
            background: #00FF80;
            border: 3px solid #000;
            padding: 12px 20px;
            font-family: 'Space Grotesk', monospace;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transform: rotate(-1deg);
            transition: all 0.1s;
        }

        button:hover {
            transform: rotate(-1deg) translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        button:active {
            transform: rotate(-1deg) translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            border: 3px solid #000;
            padding: 12px;
            font-family: 'Space Grotesk', monospace;
            font-size: 14px;
            background: #F0F0F0;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px #FF0080;
        }

        .output {
            background: #000;
            color: #00FF80;
            padding: 15px;
            border: 3px solid #000;
            min-height: 300px;
            font-family: 'Space Grotesk', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-x: auto;
            line-height: 1.4;
        }

        .status {
            background: #0080FF;
            color: #FFF;
            padding: 10px;
            margin-top: 10px;
            border: 3px solid #000;
            font-weight: 700;
            text-align: center;
            box-shadow: 4px 4px 0px #000;
        }

        .json { color: #FFFF00; }
        .csv-header { color: #FF0080; font-weight: 700; }
        .csv-row { color: #00FF80; }
        .keyword { color: #FF0080; font-weight: 700; }
        .string { color: #FFFF00; }
        .number { color: #0080FF; }
        .comment { color: #888; }

        @media (max-width: 768px) {
            .main-panel {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 TEXT FORMATTER PRO</h1>
        </div>

        <div class="help-panel">
            <h3>🚀 HOW TO USE:</h3>
            <p>Paste any text (JSON, CSV, code, logs) → Auto-detects format → Pretty prints → Search/filter → Copy results. Supports regex search!</p>
        </div>

        <div class="main-panel">
            <div class="input-section">
                <div class="section-title">📥 INPUT</div>
                <textarea id="input" placeholder="Paste your text here... (JSON, CSV, code, logs, anything!)"></textarea>
                <div class="controls">
                    <button onclick="formatText()">🎨 FORMAT</button>
                    <button onclick="clearAll()">🗑️ CLEAR</button>
                </div>
            </div>

            <div class="output-section">
                <div class="section-title">📤 OUTPUT</div>
                <div class="controls">
                    <input type="text" id="search" class="search-input" placeholder="Search or regex pattern..." oninput="filterOutput()">
                    <button onclick="copyOutput()">📋 COPY</button>
                </div>
                <div id="output" class="output">Formatted output will appear here...</div>
            </div>
        </div>

        <div id="status" class="status">Ready to format text! 🎯</div>
    </div>

    <script>
        let formattedData = '';
        let currentFormat = 'text';

        function detectFormat(text) {
            text = text.trim();
            if (!text) return 'empty';
            
            try {
                JSON.parse(text);
                return 'json';
            } catch {}
            
            const lines = text.split('\n').filter(l => l.trim());
            if (lines.length > 1) {
                const firstRow = lines[0].split(/[,\t]/);
                if (firstRow.length > 1) {
                    const consistent = lines.slice(1, 5).every(line => {
                        const cols = line.split(/[,\t]/);
                        return cols.length === firstRow.length;
                    });
                    if (consistent) return 'csv';
                }
            }
            
            const codeKeywords = /\b(function|const|let|var|if|else|for|while|class|import|export|return|async|await|try|catch)\b/;
            if (codeKeywords.test(text)) return 'code';
            
            return 'text';
        }

        function formatJSON(text) {
            try {
                const parsed = JSON.parse(text);
                const formatted = JSON.stringify(parsed, null, 2);
                return formatted.replace(/(".*?")/g, '<span class="string">$1</span>')
                              .replace(/(\d+\.?\d*)/g, '<span class="number">$1</span>')
                              .replace(/(true|false|null)/g, '<span class="keyword">$1</span>');
            } catch {
                return text;
            }
        }

        function formatCSV(text) {
            const lines = text.split('\n').filter(l => l.trim());
            const delimiter = text.includes('\t') ? '\t' : ',';
            
            let result = '';
            lines.forEach((line, i) => {
                const cols = line.split(delimiter);
                const maxWidth = 20;
                const formatted = cols.map(col => col.trim().padEnd(maxWidth)).join(' | ');
                
                if (i === 0) {
                    result += `<span class="csv-header">${formatted}</span>\n`;
                    result += '<span class="csv-header">' + '-'.repeat(formatted.length) + '</span>\n';
                } else {
                    result += `<span class="csv-row">${formatted}</span>\n`;
                }
            });
            
            return result;
        }

        function formatCode(text) {
            return text.replace(/\b(function|const|let|var|if|else|for|while|class|import|export|return|async|await|try|catch|public|private|static)\b/g, '<span class="keyword">$1</span>')
                      .replace(/(".*?"|'.*?'|`.*?`)/g, '<span class="string">$1</span>')
                      .replace(/(\d+\.?\d*)/g, '<span class="number">$1</span>')
                      .replace(/(\/\/.*$|\/\*[\s\S]*?\*\/)/gm, '<span class="comment">$1</span>');
        }

        function formatText() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            
            if (!input.trim()) {
                status.textContent = '⚠️ Please enter some text to format!';
                return;
            }
            
            currentFormat = detectFormat(input);
            
            switch (currentFormat) {
                case 'json':
                    formattedData = formatJSON(input);
                    status.textContent = '✅ JSON detected and formatted!';
                    break;
                case 'csv':
                    formattedData = formatCSV(input);
                    status.textContent = '✅ CSV detected and formatted!';
                    break;
                case 'code':
                    formattedData = formatCode(input);
                    status.textContent = '✅ Code detected and highlighted!';
                    break;
                default:
                    formattedData = input;
                    status.textContent = '✅ Plain text formatted!';
            }
            
            output.innerHTML = formattedData;
        }

        function filterOutput() {
            const searchTerm = document.getElementById('search').value;
            const output = document.getElementById('output');
            
            if (!formattedData) return;
            
            if (!searchTerm) {
                output.innerHTML = formattedData;
                return;
            }
            
            try {
                const regex = new RegExp(searchTerm, 'gi');
                const lines = formattedData.split('\n');
                const filtered = lines.filter(line => {
                    const plainText = line.replace(/<[^>]*>/g, '');
                    return regex.test(plainText);
                });
                
                if (filtered.length === 0) {
                    output.innerHTML = '<span style="color: #FF0080;">No matches found for: ' + searchTerm + '</span>';
                } else {
                    const highlighted = filtered.map(line => {
                        return line.replace(new RegExp(`(${searchTerm})`, 'gi'), '<span style="background: #FF0080; color: #000; padding: 2px;">$1</span>');
                    }).join('\n');
                    output.innerHTML = highlighted;
                }
            } catch {
                const lines = formattedData.split('\n');
                const filtered = lines.filter(line => {
                    const plainText = line.replace(/<[^>]*>/g, '');
                    return plainText.toLowerCase().includes(searchTerm.toLowerCase());
                });
                output.innerHTML = filtered.join('\n');
            }
        }

        async function copyOutput() {
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            
            const textToCopy = output.textContent || output.innerText;
            
            if (!textToCopy.trim()) {
                status.textContent = '⚠️ Nothing to copy! Format some text first.';
                return;
            }
            
            try {
                await navigator.clipboard.writeText(textToCopy);
                status.textContent = '✅ Copied to clipboard!';
            } catch {
                const textArea = document.createElement('textarea');
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                status.textContent = '✅ Copied to clipboard (fallback)!';
            }
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').innerHTML = 'Formatted output will appear here...';
            document.getElementById('search').value = '';
            document.getElementById('status').textContent = 'Ready to format text! 🎯';
            formattedData = '';
        }

        document.getElementById('input').addEventListener('paste', () => {
            setTimeout(formatText, 100);
        });

        document.getElementById('search').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') filterOutput();
        });
    </script>
</body>
</html>
